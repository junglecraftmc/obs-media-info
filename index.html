<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video-Timer</title>
<style>
  :root{
    --bg: #0c0e12;
    --panel: #15181e;
    --panel-2: #1b1f27;
    --border: #262b34;
    --text: #eef0f3;
    --muted: #7d8590;
    --live: #e5383b;
    --live-dim: rgba(229,56,59,0.16);
    --pause: #d99a2b;
    --pause-dim: rgba(217,154,43,0.16);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  .mono{
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;
  }
  #app{ display:flex; flex-direction:column; height:100%; }

  header{
    display:flex; align-items:center; gap:8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  header .title{ font-weight:600; letter-spacing:0.2px; flex:1; }
  .conn{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .dot{ width:7px; height:7px; border-radius:50%; background:#4a4f59; transition: background .2s; }
  .dot.online{ background:#3ecf6e; }
  .dot.connecting{ background:#d99a2b; }
  .dot.offline{ background:#e5383b; }
  #gear{
    width:26px; height:26px; border-radius:6px; border:1px solid var(--border);
    background: var(--panel-2); color: var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; line-height:1;
  }
  #gear:hover{ color: var(--text); border-color:#3a3f4a; }

  #settings{
    display:none; flex-direction:column; gap:8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    flex-shrink:0;
  }
  #settings.open{ display:flex; }
  .row{ display:flex; gap:8px; }
  .field{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .field.small{ flex: 0 0 84px; }
  .field label{ font-size:11px; color:var(--muted); }
  .field input{
    background: var(--bg); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:6px 8px; font-size:13px;
  }
  .field input:focus{ outline:none; border-color:#4a4f59; }
  #connect-btn{
    margin-top:2px; align-self:flex-start;
    background: var(--panel); border:1px solid var(--border); color: var(--text);
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  #connect-btn:hover{ border-color:#4a4f59; }
  .remember{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; }
  .hint{ font-size:11px; color:var(--muted); line-height:1.5; }

  main{ flex:1; overflow-y:auto; padding: 12px; display:flex; flex-direction:column; gap:10px; }

  .card{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding: 12px 14px;
    cursor:pointer;
    user-select:none; -webkit-user-select:none;
    transition: border-color .15s, background .15s;
  }
  .card:hover{ border-color:#3a3f4a; }
  .card.selected{ border-color: var(--live); background: #1a1314; }
  .card-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .name{ font-weight:600; font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill{
    display:flex; align-items:center; gap:5px;
    font-size:11px; padding:3px 8px; border-radius:20px; flex-shrink:0;
  }
  .pill.playing{ background: var(--live-dim); color: var(--live); }
  .speed{ font-size:11px; color:var(--muted); border:1px solid var(--border); border-radius:20px; padding:2px 7px; flex-shrink:0; }
  .pill.paused{ background: var(--pause-dim); color: var(--pause); }
  .pill.ended{ background: rgba(125,133,144,0.16); color: var(--muted); }
  .card.ended .value.accent{ color: var(--muted); }
  .card.ended .bar .fill{ background: var(--muted); }
  .pdot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.playing .pdot{ animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .times{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .time-block .label{ font-size:11px; color:var(--muted); margin-bottom:2px; }
  .time-block.right{ text-align:right; }
  .time-block .value{ font-size:22px; font-weight:600; letter-spacing:0.3px; }
  .time-block .value.accent{ color: var(--live); }

  .bar{ height:4px; background:var(--border); border-radius:4px; overflow:hidden; }
  .bar .fill{ height:100%; background: var(--live); border-radius:4px; transition: width .2s linear; }

  #empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color: var(--muted); text-align:center; padding: 20px;
  }
  #empty .ring{ width:34px; height:34px; border-radius:50%; border:2px solid var(--border); }
  #empty-text{ font-size:13px; max-width: 220px; }

  #controls{
    flex-shrink:0; display:flex; flex-direction:column; align-items:stretch; gap:8px;
    padding: 8px 12px; border-top: 1px solid var(--border);
  }
  .ctrl-row{ display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
  #seek-wrap{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
  #seek-wrap span{ min-width:34px; }
  #seek-wrap span:last-child{ text-align:right; }
  #seek{ flex:1; min-width:0; margin:0; accent-color: var(--live); cursor:pointer; }
  #seek:disabled{ opacity:.35; cursor:not-allowed; }
  .ctrl-btn{
    display:flex; align-items:center; gap:5px;
    background: var(--panel-2); border:1px solid var(--border); color: var(--text);
    padding:4px 12px; border-radius:20px; font-size:11px; cursor:pointer;
  }
  .ctrl-btn:hover:not(:disabled){ border-color:#4a4f59; }
  .ctrl-btn:disabled{ opacity:.35; cursor:not-allowed; }

  footer{
    flex-shrink:0; padding: 8px 12px;
    border-top: 1px solid var(--border);
    font-size: 10px; color: var(--muted);
    text-align: center; line-height: 1.5;
  }
  footer .version{ color: var(--text); font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="title">Video-Timer</span>
    <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">Nicht verbunden</span></span>
    <button id="gear" title="Verbindungseinstellungen">⚙</button>
  </header>

  <div id="settings">
    <div class="row">
      <div class="field">
        <label for="host">Host</label>
        <input id="host" type="text" value="localhost">
      </div>
      <div class="field small">
        <label for="port">Port</label>
        <input id="port" type="text" value="4455">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="password">obs-websocket-Passwort (falls gesetzt)</label>
        <input id="password" type="password" placeholder="leer lassen, falls Auth deaktiviert">
      </div>
    </div>
    <label class="remember"><input id="remember" type="checkbox" checked> Verbindungsdaten merken</label>
    <button id="connect-btn">Verbinden</button>
    <div class="hint">Server-Einstellungen in OBS: Werkzeuge → obs-websocket-Einstellungen. Erkannt werden Medienquellen (Video/VLC) in der aktuell aktiven Programm-Szene.</div>
  </div>

  <main>
    <div id="list"></div>
    <div id="empty">
      <div class="ring"></div>
      <div id="empty-text">Nicht verbunden mit OBS.</div>
    </div>
  </main>

  <div id="controls">
    <div id="seek-wrap">
      <span id="seek-left" class="mono">0:00</span>
      <input id="seek" type="range" min="0" max="1" step="1" value="0" disabled>
      <span id="seek-right" class="mono">0:00</span>
    </div>
    <div class="ctrl-row">
      <button id="btn-back" class="ctrl-btn" disabled>⏪ −10 s</button>
      <button id="btn-pause" class="ctrl-btn" disabled>⏸ Pause</button>
      <button id="btn-play" class="ctrl-btn" disabled>▶ Weiter</button>
      <button id="btn-fwd" class="ctrl-btn" disabled>+10 s ⏩</button>
    </div>
  </div>

  <footer><span class="version">v1.1</span><br>Entwickelt für JungleCraft Livestreams<br>erstellt von Junglecraft Social-Media-Team</footer>
</div>

<script>
(function(){
  let ws = null, identified = false;
  let reqCounter = 0;
  const pending = new Map();
  let reconnectTimer = null;
  let currentScene = null;
  let mediaSourceNames = [];
  let selectedSource = '';
  let seeking = false;      // true, solange der Spulregler gezogen wird
  let statuses = {};
  let speeds = {};          // eingestellte Geschwindigkeit je Quelle (1 = normal), falls OBS sie nennt
  const LINGER_MS = 5000;   // so lange bleibt eine beendete Karte sichtbar
  const FADE_MS = 1000;     // Ausblenden in der letzten Sekunde
  let lastActive = {};      // Quellen, die zuletzt läuft/pausiert waren
  let lingering = {};       // beendete Quellen: name -> {until, duration}
  let sceneTimer = null, pollTimer = null, tickTimer = null;

  const $ = id => document.getElementById(id);

  function b64FromBuffer(buf){
    let binary = '';
    const bytes = new Uint8Array(buf);
    for(let i=0;i<bytes.byteLength;i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  async function sha256b64(str){
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return b64FromBuffer(digest);
  }

  function setStatus(text, cls){
    $('conn-dot').className = 'dot ' + (cls || '');
    $('conn-text').textContent = text;
  }

  function send(op, d){ ws.send(JSON.stringify({op, d})); }

  function req(requestType, requestData){
    return new Promise((resolve, reject) => {
      const requestId = 'r' + (++reqCounter);
      pending.set(requestId, {resolve, reject});
      send(6, {requestType, requestId, requestData: requestData || {}});
      setTimeout(() => {
        if(pending.has(requestId)){ pending.delete(requestId); reject(new Error('Timeout')); }
      }, 5000);
    });
  }

  const STORE_KEY = 'jc-obs-video-timer';

  function loadSettings(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      if(d.host) $('host').value = d.host;
      if(d.port) $('port').value = d.port;
      if(d.password) $('password').value = d.password;
    }catch(e){ /* Speicher nicht verfügbar */ }
  }

  function saveSettings(host, port, password){
    try{
      if($('remember').checked){
        localStorage.setItem(STORE_KEY, JSON.stringify({host, port, password}));
      } else {
        localStorage.removeItem(STORE_KEY);
      }
    }catch(e){ /* Speicher nicht verfügbar */ }
  }

  function connect(){
    const host = $('host').value.trim() || 'localhost';
    const port = $('port').value.trim() || '4455';
    const password = $('password').value;
    saveSettings(host, port, password);
    clearTimeout(reconnectTimer);
    stopLoops();
    setStatus('Verbinde…', 'connecting');

    try{
      ws = new WebSocket('ws://' + host + ':' + port);
    }catch(e){
      setStatus('Verbindungsfehler', 'offline');
      scheduleReconnect();
      return;
    }

    ws.onclose = (ev) => {
      identified = false;
      stopLoops();
      if(ev && ev.code === 4009){
        // Authentifizierung fehlgeschlagen: kein Dauer-Reconnect, Einstellungen zeigen
        setStatus('Passwort nötig oder falsch', 'offline');
        $('settings').classList.add('open');
        return;
      }
      setStatus('Getrennt', 'offline');
      scheduleReconnect();
    };
    ws.onerror = () => {};

    ws.onmessage = async (ev) => {
      let msg;
      try{ msg = JSON.parse(ev.data); } catch(e){ return; }
      const op = msg.op, d = msg.d;

      if(op === 0){
        const identify = { rpcVersion: d.rpcVersion, eventSubscriptions: 2047 };
        if(d.authentication){
          const secret = await sha256b64(password + d.authentication.salt);
          identify.authentication = await sha256b64(secret + d.authentication.challenge);
        }
        send(1, identify);
      } else if(op === 2){
        identified = true;
        setStatus('Verbunden', 'online');
        startLoops();
      } else if(op === 7){
        const p = pending.get(d.requestId);
        if(p){
          pending.delete(d.requestId);
          if(d.requestStatus.result) p.resolve(d.responseData || {});
          else p.reject(new Error(d.requestStatus.comment || 'Anfrage fehlgeschlagen'));
        }
      } else if(op === 5){
        handleEvent(d.eventType);
      }
    };
  }

  function scheduleReconnect(){
    reconnectTimer = setTimeout(connect, 3000);
  }

  function handleEvent(type){
    if(type === 'CurrentProgramSceneChanged' || type === 'SceneItemEnableStateChanged' ||
       type === 'SceneItemCreated' || type === 'SceneItemRemoved'){
      refreshSceneItems();
    } else if(type === 'MediaInputPlaybackStarted' || type === 'MediaInputPlaybackEnded' ||
              type === 'MediaInputPlaybackPaused' || type === 'MediaInputPlaybackRestarted'){
      pollMedia();
    }
  }

  let kinds = {};
  async function refreshSpeeds(names){
    await Promise.all(names.map(async name => {
      if(kinds[name] !== 'ffmpeg_source') return;
      try{
        const r = await req('GetInputSettings', {inputName: name});
        const pct = r.inputSettings && r.inputSettings.speed_percent;
        speeds[name] = (typeof pct === 'number' && pct > 0) ? pct / 100 : 1;
      }catch(e){ /* dann Messwert verwenden */ }
    }));
    Object.keys(speeds).forEach(k => { if(!names.includes(k)) delete speeds[k]; });
  }

  async function refreshSceneItems(){
    try{
      const cur = await req('GetCurrentProgramScene');
      currentScene = cur.currentProgramSceneName;
      const list = await req('GetSceneItemList', {sceneName: currentScene});
      const names = list.sceneItems
        .filter(it => it.sceneItemEnabled && (it.inputKind === 'ffmpeg_source' || it.inputKind === 'vlc_source'))
        .map(it => it.sourceName);
      mediaSourceNames = names;
      kinds = {};
      list.sceneItems.forEach(it => { kinds[it.sourceName] = it.inputKind; });
      syncSelection(names);
      await refreshSpeeds(names);
      Object.keys(statuses).forEach(key => { if(!names.includes(key)) delete statuses[key]; });
      await pollMedia();
    }catch(e){ /* Szene evtl. gerade im Wechsel */ }
  }

  async function pollMedia(){
    await Promise.all(mediaSourceNames.map(async name => {
      try{
        const st = await req('GetMediaInputStatus', {inputName: name});
        const prev = statuses[name];
        const now = performance.now();
        const cur = {
          state: st.mediaState,
          duration: st.mediaDuration,
          cursor: st.mediaCursor,
          ts: now,
          rate: prev && prev.rate ? prev.rate : 1,
          shown: prev ? prev.shown : undefined,
          remShown: prev ? prev.remShown : undefined
        };
        // Tatsächliche Abspielrate über ein Fenster von ~6 s messen (Fallback für Quellen ohne Geschwindigkeitsangabe, z. B. VLC)
        if(cur.state === 'OBS_MEDIA_STATE_PLAYING'){
          let hist = (prev && prev.hist) ? prev.hist : [];
          const last = hist[hist.length - 1];
          if(last && (cur.cursor < last.cursor || cur.cursor - last.cursor > (now - last.ts) * 4 + 500)) hist = [];  // Sprung/Neustart
          hist.push({ts: now, cursor: cur.cursor});
          while(hist.length > 2 && now - hist[0].ts > 6000) hist.shift();
          const span = now - hist[0].ts;
          if(span >= 1800){
            const measured = (cur.cursor - hist[0].cursor) / span;
            cur.rate = Math.round(Math.min(4, Math.max(0.1, measured)) * 100) / 100;
          }
          cur.hist = hist;
        }
        if(cur.state !== 'OBS_MEDIA_STATE_PLAYING'){ cur.shown = undefined; cur.remShown = undefined; cur.hist = undefined; }
        statuses[name] = cur;
        // Neue Quelle/Neustart nicht mit alter Position vermischen
        if(prev && Math.abs(cur.cursor - prev.cursor) > 2500 + (now - prev.ts) * 4){ cur.shown = undefined; cur.remShown = undefined; }
      }catch(e){ delete statuses[name]; }
    }));
    render();
  }

  function syncSelection(names){
    if(selectedSource && !names.includes(selectedSource)) selectedSource = '';
    updateControlsState();
  }

  // Geschätzte Position: nutzt die Wiedergabegeschwindigkeit und läuft nie rückwärts (kein Zucken)
  function effectiveRate(name, s){
    if(speeds[name]) return speeds[name];
    return s.rate || 1;
  }
  function estimateCursor(name, s){
    if(s.state !== 'OBS_MEDIA_STATE_PLAYING') return s.cursor;
    const rate = effectiveRate(name, s);
    let est = Math.min(s.duration, s.cursor + (performance.now() - s.ts) * rate);
    if(s.shown !== undefined && est < s.shown && s.shown - est < 1500) est = s.shown;
    s.shown = est;
    return est;
  }

  function remainingSeconds(s, cursor, rate){
    let rem = Math.max(0, (s.duration - cursor) / rate);
    if(s.state === 'OBS_MEDIA_STATE_PLAYING'){
      if(s.remShown !== undefined && rem > s.remShown && rem - s.remShown < Math.max(1500, rem * 0.04)) rem = s.remShown;
      s.remShown = rem;
    }
    return rem;
  }

  function updateControlsState(){
    const enabled = identified && !!selectedSource;
    $('btn-pause').disabled = !enabled;
    $('btn-play').disabled = !enabled;
    updateSeek();
  }

  // Aktueller Stand der ausgewählten Quelle (nur wenn sie läuft/pausiert ist)
  function seekInfo(){
    const st = selectedSource && statuses[selectedSource];
    if(!st) return null;
    const playing = st.state === 'OBS_MEDIA_STATE_PLAYING';
    if(!playing && st.state !== 'OBS_MEDIA_STATE_PAUSED') return null;
    if(!(st.duration > 0)) return null;
    const cursor = estimateCursor(selectedSource, st);
    return {name: selectedSource, duration: st.duration, cursor: cursor};
  }

  function updateSeek(){
    const info = identified ? seekInfo() : null;
    const bar = $('seek');
    const ok = !!info;
    bar.disabled = !ok;
    $('btn-back').disabled = !ok;
    $('btn-fwd').disabled = !ok;
    if(!ok){
      seeking = false;
      bar.max = 1; bar.value = 0;
      $('seek-left').textContent = '0:00';
      $('seek-right').textContent = '0:00';
      return;
    }
    bar.max = info.duration;
    if(!seeking){
      bar.value = info.cursor;
      $('seek-left').textContent = fmtTime(info.cursor);
    }
    $('seek-right').textContent = fmtTime(info.duration);
  }

  async function seekTo(ms){
    const info = seekInfo();
    if(!info) return;
    // knapp vor dem Ende stoppen, damit das Video normal ausläuft
    const target = Math.round(Math.max(0, Math.min(Math.max(0, info.duration - 250), ms)));
    try{
      await req('SetMediaInputCursor', {inputName: info.name, mediaCursor: target});
      const st = statuses[info.name];
      if(st){ st.cursor = target; st.ts = performance.now(); st.shown = undefined; st.remShown = undefined; st.hist = undefined; }
    }catch(e){ /* Quelle evtl. nicht mehr vorhanden */ }
    render();
  }

  function skip(deltaMs){
    const info = seekInfo();
    if(info) seekTo(info.cursor + deltaMs);
  }

  async function triggerMedia(action){
    if(!selectedSource) return;
    try{ await req('TriggerMediaInputAction', {inputName: selectedSource, mediaAction: action}); }
    catch(e){ /* Quelle evtl. nicht mehr vorhanden */ }
  }

  function startLoops(){
    refreshSceneItems();
    sceneTimer = setInterval(refreshSceneItems, 3000);
    pollTimer = setInterval(pollMedia, 1000);
    tickTimer = setInterval(render, 200);
  }
  function stopLoops(){
    clearInterval(sceneTimer); clearInterval(pollTimer); clearInterval(tickTimer);
    statuses = {}; speeds = {}; mediaSourceNames = []; selectedSource = ''; lastActive = {}; lingering = {};
    updateControlsState();
    render();
  }

  function fmtTime(ms){
    let s = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;
    const p = n => String(n).padStart(2, '0');
    return h > 0 ? (h + ':' + p(m) + ':' + p(s)) : (m + ':' + p(s));
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render(){
    renderCards();
    updateSeek();
  }

  function renderCards(){
    const list = $('list');
    const empty = $('empty');

    if(!identified){
      list.innerHTML = '';
      empty.style.display = 'flex';
      $('empty-text').textContent = 'Nicht verbunden mit OBS.';
      return;
    }

    const now = performance.now();
    const isActive = st => st && (st.state === 'OBS_MEDIA_STATE_PLAYING' || st.state === 'OBS_MEDIA_STATE_PAUSED');

    // Beendete Videos 5 Sekunden stehen lassen
    Object.keys(lastActive).forEach(name => {
      if(isActive(statuses[name])) return;
      if(statuses[name] && mediaSourceNames.includes(name)){
        lingering[name] = {until: now + LINGER_MS, duration: lastActive[name].duration};
      }
      delete lastActive[name];
    });
    mediaSourceNames.forEach(name => {
      if(isActive(statuses[name])){
        lastActive[name] = {duration: statuses[name].duration};
        delete lingering[name];
      }
    });
    Object.keys(lingering).forEach(name => {
      if(lingering[name].until <= now || !mediaSourceNames.includes(name)) delete lingering[name];
    });

    const active = mediaSourceNames
      .filter(name => isActive(statuses[name]) || lingering[name])
      .map(name => [name, statuses[name]]);

    if(active.length === 0){
      list.innerHTML = '';
      empty.style.display = 'flex';
      $('empty-text').textContent = 'Kein Video läuft in der aktuellen Szene.';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = active.map(([name, s]) => {
      const ended = !isActive(s);
      const playing = !ended && s.state === 'OBS_MEDIA_STATE_PLAYING';
      let duration = ended ? lingering[name].duration : s.duration;
      let cursor = ended ? duration : s.cursor;
      let rate = 1;
      if(!ended){ rate = effectiveRate(name, s); if(playing) cursor = estimateCursor(name, s); }
      // verbleibende echte Zeit = Restlänge / Geschwindigkeit
      const remaining = ended ? 0 : remainingSeconds(s, cursor, rate);
      const speedTag = (!ended && Math.abs(rate - 1) > 0.03)
        ? '<span class="speed">' + (Math.round(rate * 100) / 100).toString().replace('.', ',') + '×</span>' : '';
      const pct = duration > 0 ? Math.min(100, (cursor / duration) * 100) : 0;
      let style = '';
      if(ended){
        const left = lingering[name].until - now;
        if(left < FADE_MS) style = ' style="opacity:' + Math.max(0, left / FADE_MS).toFixed(2) + '"';
      }
      const pillClass = ended ? 'ended' : (playing ? 'playing' : 'paused');
      const pillText = ended ? 'Beendet' : (playing ? 'Läuft' : 'Pause');
      return (
        '<div class="card' + (ended ? ' ended' : '') + (name === selectedSource ? ' selected' : '') + '" data-name="' + escapeHtml(name) + '"' + style + '>' +
          '<div class="card-head">' +
            '<span class="name">' + escapeHtml(name) + '</span>' + speedTag +
            '<span class="pill ' + pillClass + '">' +
              '<span class="pdot"></span>' + pillText +
            '</span>' +
          '</div>' +
          '<div class="times">' +
            '<div class="time-block">' +
              '<div class="label">Verstrichen</div>' +
              '<div class="value mono">' + fmtTime(cursor) + '</div>' +
            '</div>' +
            '<div class="time-block right">' +
              '<div class="label">Verbleibend</div>' +
              '<div class="value mono accent">' + fmtTime(remaining) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
        '</div>'
      );
    }).join('');
  }

  $('connect-btn').addEventListener('click', () => { if(ws) ws.close(); connect(); });
  $('gear').addEventListener('click', () => { $('settings').classList.toggle('open'); });
  // pointerdown statt click: die Karten werden alle 200 ms neu gezeichnet, dadurch ging bei click oft der Klick verloren
  $('list').addEventListener('pointerdown', (ev) => {
    const card = ev.target.closest('.card');
    if(!card) return;
    selectedSource = (selectedSource === card.dataset.name) ? '' : card.dataset.name;
    updateControlsState();
    render();
  });
  $('btn-pause').addEventListener('click', () => triggerMedia('OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PAUSE'));
  $('btn-play').addEventListener('click', () => triggerMedia('OBS_WEBSOCKET_MEDIA_INPUT_ACTION_PLAY'));
  $('btn-back').addEventListener('click', () => skip(-10000));
  $('btn-fwd').addEventListener('click', () => skip(10000));

  const seekEl = $('seek');
  seekEl.addEventListener('pointerdown', () => { seeking = true; });
  seekEl.addEventListener('input', () => { $('seek-left').textContent = fmtTime(+seekEl.value); });
  seekEl.addEventListener('change', () => { seeking = false; seekTo(+seekEl.value); });
  ['pointerup', 'pointercancel', 'blur'].forEach(ev =>
    seekEl.addEventListener(ev, () => { seeking = false; }));

  loadSettings();
  render();
  connect();
})();
</script>
</body>
</html>
